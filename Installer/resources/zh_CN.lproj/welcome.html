<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="utf-8"></head>
<body style="font-family: -apple-system, sans-serif; font-size: 13px;">
<h2>Mac Display Volume</h2>
<p>让 macOS 像控制普通扬声器一样，调节外接显示器的音量。</p>
<p>安装程序会安装：</p>
<ul>
  <li>菜单栏应用：<code>/Applications/Mac Display Volume.app</code></li>
  <li>音频驱动：<code>/Library/Audio/Plug-Ins/HAL/MacDisplayVolumeAudio.driver</code></li>
</ul>
<p>安装过程中系统声音会短暂中断（重启 CoreAudio），完成后应用会自动打开。</p>
<p style="color: #888;">本项目 fork 自 boyan01/mac-display-volume，基于 Apache License 2.0 开源。</p>
</body></html>
